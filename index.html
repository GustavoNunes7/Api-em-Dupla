<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎞️ Movie Explorer</title>
    <link rel="stylesheet" href="/frontend/styles.css">
</head>

<body>

    <div class="container">

        <h1>🎞️ Movie Explorer</h1>
        <p class="subtitle">Consumindo nossa própria API em Node.js</p>

        <div class="movie-area">
            <img src="" alt="Filme" id="movieImage">
            <div id="genName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Filme Aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="genInput"
                placeholder="Digite um gênero de filme(ex: romance)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

        <footer> Desenvolvido por Gabriel Viana e Gustavo Nunes.</footer>

    </div>

    <script src="/frontend/script.js"></script>

</body>
</html>
